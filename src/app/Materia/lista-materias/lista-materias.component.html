<div class="p-4 mt-5">
    <div>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a routerLink="/home" class="text-decoration-none text-secondary">Inicio</a>
                </li>
                <li class=" breadcrumb-item active" aria-current="page">Materias</li>
            </ol>
        </nav>
    </div>
    <h2 class="text-center">Gestión de Materias</h2>
</div>
<div class="container">
    <div *ngIf="mensaje" class="alert alert-success" role="alert">
            {{ mensaje }}
    </div>
    <h2>Materias</h2>
    <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
        <h1 class="text-start col-lg-3 " ></h1>
            <div class="d-flex gap-2">
                <a *ngIf ="BloquearSecretaria()" class="btn btn-primary"  data-bs-toggle="tooltip"
                    data-bs-placement="top" title="Agregar una nueva materia"
                    routerLink="/materias/agregarMaterias" routerLincActive="active">
                    <i class="bi bi-person-plus"></i> Crear
                </a>
            </div>
    </div>
    <div class="table-responsive">
        <table class="table table-hover table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th style="text-align: center;">Codigo</th>
                    <th style="text-align: center;">Nombre</th>
                    <th style="text-align: center;">Tipo</th>
                    <th style="width: 10%; text-align: center;">Actividad</th>
                    <th style="width: 10%; text-align: center;">Editar</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let materia of materias; let i=index">
                    <td>{{materia.codigo_materia}}</td>
                    <td>{{materia.nombre_materia}}</td>
                    <td>{{materia.tipo_materia}}</td>
                    <td class="d-flex justify-content-center">
                        <div class="form-check form-switch">
                            <input class="form-check-input"
                                    type="checkbox"
                                    role="switch"
                                    [checked]="materia.estado_materia"
                                    [ngClass]="{
                                        'bg-success': materia.estado_materia,
                                        'bg-danger': !materia.estado_materia
                                    }"
                                    (change)="cambiarEstadoActividad(materia)">
                        </div>
                    </td>
                    <td>
                        <a *ngIf="BloquearSecretaria()" class="btn btn-primary btn-sm mx-1"
                            data-bs-toggle="tooltip" data-bs-placement="top" title="Editar" [routerLink]="['/materias', materia.codigo_materia]">
                            <i class="bi bi-pencil-square "></i>
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

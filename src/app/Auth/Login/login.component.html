<!-- Fondo y centramiento -->
<div class="full-screen d-flex justify-content-center align-items-center">
  <div class="login-container text-center">
    <div class="system-header mb-4">
      <p class="system-description">
        Plataforma de Registro e Información del Sistema de Manejo Académico
      </p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="login-form bg-white p-5 shadow-sm">
      <h2 class="text-primary fw-bold mb-4">Iniciar Sesión</h2>

      <div class="mb-3 text-start">
        <label class="form-label fw-semibold">Correo</label>
        <input
          type="email"
          formControlName="correo"
          class="form-control form-control-lg"
          placeholder=""
          autocomplete="username"
        />
      </div>

      <div class="mb-4 text-start">
        <label class="form-label fw-semibold">Contraseña</label>
        <input
          type="password"
          formControlName="password"
          class="form-control form-control-lg"
          placeholder=""
          autocomplete="current-password"
        />
      </div>

      <div class="mt-3">
        <a (click)="recuperar()" class="text-primary fw-semibold" style="cursor:pointer;">
          ¿Olvidaste tu contraseña?
        </a>
      </div>

      <button type="submit" [disabled]="form.invalid" class="btn btn-primary btn-lg w-100 shadow-sm">
        Entrar
      </button>

      <div class="error mt-4 text-danger fw-semibold" *ngIf="error">
        {{ error }}
      </div>
    </form>
  </div>
</div>

<!-- Modal de confirmación -->
<div class="modal fade" id="recuperarModal" tabindex="-1" aria-labelledby="recuperarModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow">
      <div class="modal-header bg-primary text-white">
        <h5 class="modal-title" id="recuperarModalLabel">Recuperación de contraseña</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body text-center">
        <p>Se envió un correo con la nueva contraseña temporal.</p>
        <p>Por favor cámbiala después de iniciar sesión.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary w-100" data-bs-dismiss="modal">Aceptar</button>
      </div>
    </div>
  </div>
</div>

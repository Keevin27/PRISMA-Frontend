<div class="container my-4 py-5">
  <h2 class="text-center">Gestión de Usuarios</h2>

  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap">
    <h1 class="text-start col-lg-3"></h1>
    <div class="d-flex gap-2">
      <a class="btn btn-primary" *ngIf="BloquearDocente()"
         data-bs-toggle="tooltip" data-bs-placement="top" title="Agregar un nuevo usuario"
         (click)="nuevoUsuario()">
        <i class="bi bi-person-plus"></i> Agregar
      </a>
    </div>
  </div>

  <div class="table-responsive">
    <table class="table table-hover table-striped table-bordered">
      <thead class="table-dark">
        <tr>
          <th style="text-align: center;">N°</th>
          <th style="text-align: center;">Correo</th>
          <th style="text-align: center;">Rol</th>
          <th style="text-align: center;">Activo</th>
          <th style="text-align: center;">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let u of usuarios; let i = index">
          <td style="text-align: center;">{{ i + 1 }}</td>
          <td>{{ u.correoUsuario }}</td>
          <td>{{ getNombreRol(u) }}</td>
          <td class="d-flex justify-content-center">
            <div class="form-check form-switch">
              <input class="form-check-input"
                     type="checkbox"
                     role="switch"
                     [checked]="u.usuarioActivo"
                     [ngClass]="{
                        'bg-success': u.usuarioActivo,
                        'bg-danger': !u.usuarioActivo
                      }"
                     (change)="toggleActivo(u, $event)">
            </div>
          </td>
          <td>
            <div class="d-flex justify-content-center">
              <button class="btn btn-secondary btn-sm mx-1"
                      data-bs-toggle="modal" data-bs-target="#cambiarRolModal"
                      (click)="abrirModalCambioRol(u)">
                <i class="bi bi-shield-lock"></i>
              </button>
              <button class="btn btn-danger btn-sm mx-1"
                      data-bs-toggle="tooltip" data-bs-placement="top" title="Eliminar"
                      (click)="eliminarUsuario(u.idUsuario!)">
                <i class="bi bi-trash"></i>
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <div class="alert alert-info alert-dismissible fade show mt-1 ms-2 mr-2" *ngIf="usuarios.length === 0">
      <i class="bi bi-exclamation-triangle"></i>
      No hay usuarios registrados.
    </div>
  </div>
</div>

<!-- Modal para cambiar rol -->
<div class="modal fade" id="cambiarRolModal" tabindex="-1" aria-labelledby="cambiarRolLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="cambiarRolLabel">Cambiar Rol del Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <p><strong>Correo:</strong> {{ usuarioSeleccionado?.correoUsuario }}</p>
        <div class="mb-3">
          <label for="nuevoRol" class="form-label">Nuevo Rol:</label>
          <select [(ngModel)]="nuevoRolId" class="form-select" id="nuevoRol">
            <option *ngFor="let r of roles" [value]="r.id">{{ formatearNombreRol(r.nombre) }}</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-success" (click)="cambiarRolUsuario()">Guardar</button>
        <button class="btn btn-danger" data-bs-dismiss="modal">Cancelar</button>
      </div>
    </div>
  </div>
</div>
